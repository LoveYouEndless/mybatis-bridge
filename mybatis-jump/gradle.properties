group = io.github.mybatisbridge
version = 0.1.0

# IntelliJ Platform tasks in this project do not support configuration-cache serialization.
org.gradle.configuration-cache = false

# Keep Gradle Maven-local lookup aligned with the local Maven repository.
systemProp.maven.repo.local = D:/repository

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# Use the JBR shipped with the target IDE; do not provision a JDK online.
org.gradle.java.installations.paths = D:/idea-2025.2.3/jbr
