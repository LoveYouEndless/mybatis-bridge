import org.jetbrains.intellij.platform.gradle.TestFrameworkType

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform'
}

def localPublishConfig = file('marketplace-publish.yml')
def yamlValue = { String key ->
    if (!localPublishConfig.isFile()) {
        return null
    }
    def line = localPublishConfig.readLines('UTF-8').find { it ==~ /^\s*${java.util.regex.Pattern.quote(key)}\s*:\s*.+$/ }
    if (!line) {
        return null
    }
    def value = line.replaceFirst(/^\s*${java.util.regex.Pattern.quote(key)}\s*:\s*/, '').trim()
    value = value.replaceFirst(/^['"]/, '').replaceFirst(/['"]\s*(#.*)?$/, '')
    value ?: null
}
def yamlFile = { String key ->
    def path = yamlValue(key)
    path ? file(path) : null
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    intellijPlatform {
        intellijIdeaCommunity('2023.3')
        bundledPlugin('com.intellij.java')
        testFramework(TestFrameworkType.Platform.INSTANCE)
        zipSigner('0.1.43')
    }
}

intellijPlatform {
    instrumentCode.set(false)

    signing {
        if (yamlFile('certificate-chain-file')) {
            certificateChainFile.set(yamlFile('certificate-chain-file'))
        }
        if (yamlFile('private-key-file')) {
            privateKeyFile.set(yamlFile('private-key-file'))
        }
        if (yamlValue('private-key-password')) {
            password.set(yamlValue('private-key-password'))
        }
    }

    publishing {
        if (yamlValue('token')) {
            token.set(yamlValue('token'))
        }
        channels = ['default']
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks {
    patchPluginXml {
        sinceBuild = '233'
        untilBuild = '263.*'
        changeNotes = file('CHANGELOG.md').getText('UTF-8')
    }
}
